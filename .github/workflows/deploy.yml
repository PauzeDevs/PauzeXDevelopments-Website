name: Validate PauzeX Developments website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          for file in ./*.js; do
            node --check --input-type=module < "$file"
          done

      - name: Prepare and validate complete static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a ./*.html ./*.css ./*.js .nojekyll CNAME THREEUI-LICENSE.md _site/
          if [ -d .well-known ]; then
            mkdir -p _site/.well-known
            cp -R .well-known/. _site/.well-known/
          fi
          if [ -d assets ]; then
            mkdir -p _site/assets
            cp -R assets/. _site/assets/
          fi

      - name: Minify production JavaScript and CSS
        run: |
          set -euo pipefail
          # Keep readable source files in Git; transform only the deploy artifact.
          # Pin tool versions so a future CLI release cannot silently alter the build.
          for file in _site/*.js; do
            [ -f "$file" ] || continue
            npx --yes --package=terser@5.44.1 terser "$file" --compress --mangle --comments '/Copyright|VIEW-ONLY/' --output "$file.min"
            mv "$file.min" "$file"
          done
          for file in _site/*.css; do
            [ -f "$file" ] || continue
            npx --yes --package=clean-css-cli@5.6.3 cleancss --output "$file.min" "$file"
            mv "$file.min" "$file"
          done
          for file in _site/*.js; do
            [ -f "$file" ] || continue
            node --check --input-type=module < "$file"
          done
          echo "Production JavaScript and CSS minification completed."
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const html = fs.readFileSync("_site/index.html", "utf8");
          if (!html.includes('id="px-verify-gate"')) throw new Error("PauzeX Verify gate markup is missing.");
          const mainScript = fs.readFileSync("_site/script.js", "utf8");
          const mainStyles = fs.readFileSync("_site/styles.css", "utf8");
          if (!mainScript.includes("px_visit_count_v2") || !mainScript.includes("issueChallenge")) throw new Error("Bundled PauzeX Verify logic or challenge is missing.");
          if (!mainStyles.includes("#px-verify-gate")) throw new Error("Bundled PauzeX Verify styling is missing.");
          if (html.includes("pauzex-verify.js") || html.includes("pauzex-verify.css")) throw new Error("Standalone verification asset reference remains.");
          const attrPattern = new RegExp(String.raw`(?:src|href)=["']([^"']+)["']`, "g");
          const refs = [...html.matchAll(attrPattern)]
            .map(match => match[1])
            .filter(ref => ref.startsWith("./") && !ref.startsWith("//"));
          const missing = [...new Set(refs)]
            .filter(ref => !fs.existsSync(path.join("_site", ref.slice(2).split(/[?#]/)[0])));
          if (missing.length) {
            console.error("Missing local site assets:", missing.join(", "));
            process.exit(1);
          }
          const scripts = refs.filter(ref => ref.split(/[?#]/)[0].endsWith(".js"));
          if (!scripts.length) throw new Error("No local JavaScript bundles are referenced.");
          const heroRuntime = fs.readFileSync("_site/px-hero-3d.js", "utf8");
          const templeRenderer = fs.readFileSync("_site/templeNightRenderer.js", "utf8");
          if (!heroRuntime.includes('./templeNightRenderer.js')) throw new Error("Temple Night renderer is not wired into the hero.");
          if (!templeRenderer.includes('three@0.149.0/build/three.module.js')) throw new Error("Temple Night Three.js runtime is not pinned.");
          if (!fs.existsSync("_site/THREEUI-LICENSE.md")) throw new Error("Third-party MIT attribution is missing from the deployed artifact.");
          if (fs.readFileSync("_site/CNAME", "utf8").trim() !== "pauzex.devs.surf") throw new Error("Custom domain CNAME is missing or incorrect.");
          if (!html.includes('px-hero-3d.js?v=20261031.15')) throw new Error("Hero asset cache version was not refreshed.");
          console.log("Validated " + refs.length + " local asset references, " + scripts.length + " page scripts, Temple Night wiring, Three.js pin, and MIT attribution.");
          NODE
